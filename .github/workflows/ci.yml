name: CI

on:
  push:
    branches:
      - main
      - experiment/at-002-calibration-protocol
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 24.22.3
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false

      - name: Record execution identity
        run: |
          mkdir -p ci-evidence
          {
            echo "github_sha=${GITHUB_SHA}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "ref=${GITHUB_REF}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
          } | tee ci-evidence/environment.txt
          sha256sum package-lock.json | tee ci-evidence/package-lock.sha256

      - name: Set up Python for AT-004 model tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned AT-004 test dependency
        run: python -m pip install -r experiments/ATANOR-AT004-001/revised/requirements.txt

      - name: Run AT-004 model contract tests
        run: python -m unittest discover -s experiments/ATANOR-AT004-001/revised -p 'test_*.py' -v

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency audit
        run: |
          set +e
          npm audit --json > ci-evidence/npm-audit.json
          audit_exit=$?
          set -e
          node -e "const a=require('./ci-evidence/npm-audit.json'); const v=Object.entries(a.vulnerabilities||{}).map(([name,x])=>({name,severity:x.severity,range:x.range,fixAvailable:x.fixAvailable,via:x.via.map(y=>typeof y==='string'?y:{title:y.title,url:y.url,range:y.range})})); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, vulnerabilities:v},null,2)); if ((a.metadata?.vulnerabilities?.total ?? 0) > 0) process.exit(1)"
          if [ "$audit_exit" -ne 0 ]; then
            echo "npm audit exited with status $audit_exit"
            exit "$audit_exit"
          fi

      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee ci-evidence/npm-test.log

      - name: Build application
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-evidence/npm-build.log

      - name: Validate AT-002 plan
        run: |
          set -o pipefail
          npm run at002:plan 2>&1 | tee ci-evidence/at002-plan.log

      - name: Record dependency tree
        run: npm ls --depth=0 2>&1 | tee ci-evidence/dependencies.log

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: at002-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 30
