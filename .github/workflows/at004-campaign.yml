name: AT-004 frozen campaign

on:
  push:
    branches:
      - experiment/at-004-campaign-001
  workflow_dispatch:
    inputs:
      attempt:
        description: "Attempt number for an infrastructure retry using the same frozen source"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen campaign source
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.13.18
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.18"

      - name: Install pinned dependency
        run: python -m pip install -r experiments/ATANOR-AT004-001/revised/requirements.txt

      - name: Execute frozen 90-run campaign
        env:
          ATTEMPT_INPUT: ${{ inputs.attempt }}
        run: |
          FROZEN_SHA=$(python -c "import json; print(json.load(open('experiments/ATANOR-AT004-001/campaign-authorization.json'))['frozen_source_revision'])")
          ATTEMPT="${ATTEMPT_INPUT:-1}"
          python experiments/ATANOR-AT004-001/revised/run_campaign.py --source-revision "$FROZEN_SHA" --output-dir "at004-campaign-output-attempt-$ATTEMPT" --attempt "$ATTEMPT"

      - name: Upload complete campaign evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ATANOR-AT004-001-${{ github.run_id }}-${{ inputs.attempt || '1' }}
          path: at004-campaign-output-attempt-*/
          if-no-files-found: error
          retention-days: 90
