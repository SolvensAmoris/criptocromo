name: AT-004 frozen campaign

on:
  push:
    branches:
      - experiment/at-004-campaign-001

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen campaign source
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.13.18
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.18"

      - name: Install pinned dependency
        run: python -m pip install -r experiments/ATANOR-AT004-001/revised/requirements.txt

      - name: Execute frozen 90-run campaign
        run: |
          python experiments/ATANOR-AT004-001/revised/run_campaign.py --source-revision "$GITHUB_SHA" --output-dir at004-campaign-output --attempt 1

      - name: Upload complete campaign evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ATANOR-AT004-001-${{ github.sha }}
          path: at004-campaign-output/
          if-no-files-found: error
          retention-days: 90
