name: Behavioral equivalence evaluator v0.1

on:
  pull_request:
    paths:
      - 'scripts/behavioral-equivalence-evaluator.mjs'
      - 'scripts/behavioral-equivalence-evaluator.test.mjs'
      - 'docs/BEHAVIORAL-EQUIVALENCE-EVALUATOR-v0.1.md'
      - 'package.json'
      - '.github/workflows/behavioral-equivalence-evaluator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-evaluator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:behavioral-equivalence
