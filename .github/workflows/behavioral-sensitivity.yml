name: Behavioral sensitivity study

on:
  pull_request:
    branches: [main]
    paths:
      - "src/experiments/behavioral-sensitivity.ts"
      - "docs/BEHAVIORAL-EQUIVALENCE-SENSITIVITY-v0.1.md"
      - ".github/workflows/behavioral-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository tests
        run: npm test
      - name: Execute preregistered sensitivity study
        env:
          SENSITIVITY_AUTHORIZED: YES
          SENSITIVITY_RUN_ID: BSENS-${{ github.run_id }}
        run: npx tsx src/experiments/behavioral-sensitivity.ts
      - name: Verify artifact checksums
        env:
          SENSITIVITY_RUN_ID: BSENS-${{ github.run_id }}
        run: |
          set -euo pipefail
          cd artifacts/BEHAVIORAL-SENSITIVITY/$SENSITIVITY_RUN_ID
          sha256sum --check checksums.sha256
      - name: Upload sensitivity package
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: behavioral-sensitivity-${{ github.run_id }}
          path: artifacts/BEHAVIORAL-SENSITIVITY/BSENS-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90